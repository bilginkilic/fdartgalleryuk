; /etc/php/8.5/fpm/conf.d/99-opcache-tuning.ini
;
; OPcache ayari — 03.09.2026, interned tamponu 09.09.2026'da buyutuldu.
;
; NEDEN: sunucuda 4 WordPress sitesi var, her biri ~3240 dosya yukluyor.
; PHP varsayilani 128 MB bunlarin hepsini alamiyordu: paylasilan bellek DOLU,
; isabet orani %22, kacirma 106k. OPcache doldugunda yeni script kabul etmiyor
; ve tahliye de YAPMIYOR — derlenemeyen dosyalar her istekte yeniden derleniyor,
; her isci onlari kendi belleginde tutuyordu (fdartgallery /cart/: 2,9 sn,
; tepe bellek 186 MB).
;
; Bu ayar `fastcgi_cache`'in ULASAMADIGI trafigi kurtarir: sepet, odeme,
; hesabim ve giris yapmis kullanici. Anonim sayfalarda PHP zaten hic calismaz.
; Ikisi ayri katmandir, biri digerinin yerini TUTMAZ.

opcache.memory_consumption = 768        ; 512 dolmustu (509/512, 15.9k script) — pay birakiliyor
opcache.interned_strings_buffer = 64    ; 32 DOLMUSTU (33554416/33554432 = 16 bayt bos, 326k dize) — 09.09.2026
opcache.max_accelerated_files = 50000

; Zaman damgasi kontrolu ACIK kalir: deploy sonrasi dosya degisiklikleri
; 2 saniye icinde gorulur, elle reload gerekmez. 0 yapilirsa her deploy'dan
; sonra `systemctl reload php8.5-fpm` ZORUNLU olur — unutulursa site eski
; kodu servis etmeye devam eder.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; JIT BILEREK KAPALI. WordPress'te olcülebilir kazanc vermiyor; agir temalarda
; render riski var. Acilacaksa once dev'de olculur.

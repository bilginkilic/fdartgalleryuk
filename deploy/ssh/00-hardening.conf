# SSH sertlestirme — bkz. CLAUDE.md 5E
#
# DOSYA ADI ONEMLI: OpenSSH her anahtar icin ILK okudugu degeri kullanir ve
# sshd_config.d/*.conf alfabetik yuklenir. Bu yuzden "00-" onekiyle en basta
# okunur ve cloud-init'in yazdigi 50-cloud-init.conf'u EZER.
# (Sunucudaki hata buydu: 60-cloudimg-settings.conf "PasswordAuthentication no"
#  diyordu ama 50-cloud-init.conf'taki "yes" once okundugu icin kazaniyordu.)

# --- Kimlik dogrulama ---
PubkeyAuthentication yes
PermitRootLogin prohibit-password
PermitEmptyPasswords no
KbdInteractiveAuthentication no

# PasswordAuthentication BILEREK "yes" birakildi: sunucuda kullanicinin kendi
# public key'i YOK (/home/ubuntu/.ssh/authorized_keys bos). Kapatilirsa SSH
# erisimi tamamen kaybolur. Anahtar eklendikten ve giris DOGRULANDIKTAN sonra
# "no" yapilacak.
PasswordAuthentication yes

# --- Brute-force yuzeyini daralt ---
MaxAuthTries 3
LoginGraceTime 30
MaxSessions 10
MaxStartups 10:30:60

# --- Gereksiz ozellikleri kapat ---
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no
GatewayPorts no
DebianBanner no

# --- Modern kripto (zayif algoritmalar kapali) ---
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# --- Oturum sagligi ---
ClientAliveInterval 300
ClientAliveCountMax 2

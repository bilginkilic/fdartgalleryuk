# HTTP/2 — tum siteler icin.
#
# nginx 1.25.1+ surumlerinde `listen ... http2` KULLANIMDAN KALKTI; dogru yol
# bu direktiftir. http baglaminda tanimlanir, tum server bloklarina miras kalir.
#
# NEDEN: sayfada 89 harici varlik var (40 script + 49 stylesheet). HTTP/1.1'de
# tarayici ayni sunucuya ~6 paralel baglanti acar -> ~15 tur gidis-donus.
# Turkiye-Londra RTT ~60 ms oldugundan bu tek basina 1 saniyeden fazla bekleme
# demek. HTTP/2 hepsini TEK baglantida cogullar.
http2 on;

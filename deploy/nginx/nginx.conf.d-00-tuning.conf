# /etc/nginx/conf.d/00-tuning.conf
# Multi-site VPS icin global ayarlar.

# Not: `server_tokens` ve `gzip on` Ubuntu'nun /etc/nginx/nginx.conf dosyasinda
# zaten tanimli — burada tekrar edilirse nginx "directive is duplicate" hatasi
# verir. server_tokens'i setup-server.sh ana dosyada `off` yapar.

server_names_hash_bucket_size 64;

client_max_body_size 128M;
client_body_timeout 60s;

keepalive_timeout 30s;

gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/rss+xml
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Basit brute-force korumasi (wp-login / xmlrpc icin kullanilir)
limit_req_zone $binary_remote_addr zone=wplogin:10m rate=15r/m;

# FastCGI cache alani (site bazinda acilabilir)
fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=WPCACHE:100m inactive=60m max_size=1g;
fastcgi_cache_key "$scheme$request_method$host$wpc_cache_uri";

# --- Sayfa onbellegi atlama kurallari (WooCommerce guvenli) -------------------
# Her kural 1 dondururse o istek onbellege girmez ve onbellekten okunmaz.

# 1) Kisiye ozel oturum cerezleri
map $http_cookie $wpc_bypass_cookie {
    default                       0;
    ~*wordpress_logged_in_        1;
    ~*wp-postpass_                1;
    ~*comment_author_             1;
    ~*woocommerce_items_in_cart   1;
    ~*woocommerce_cart_hash       1;
    ~*wp_woocommerce_session_     1;
    ~*edd_items_in_cart           1;
}

# 2) Dinamik olmasi gereken adresler (WooCommerce sayfalari dahil)
map $request_uri $wpc_bypass_uri {
    default                                              0;
    ~*^/wp-admin                                         1;
    ~*^/wp-json                                          1;
    ~*^/wp-login\.php                                    1;
    ~*^/xmlrpc\.php                                      1;
    ~*^/wp-cron\.php                                     1;
    ~*^/wc-api                                           1;
    ~*^/(cart|checkout|my-account)(/|$)                  1;
    ~*^/(sepet|odeme|hesabim|siparis)(/|$)               1;
    ~*add-to-cart=                                       1;
    ~*/feed(/|$)                                         1;
    ~*sitemap.*\.xml                                     1;
}

# 3) Yalnizca GET/HEAD onbelleklenir
map $request_method $wpc_bypass_method {
    default 1;
    GET     0;
    HEAD    0;
}

# 4) Sorgu dizesi olan istekler onbellegi atlar — AMA reklam/bulten
#    izleme parametreleri istisna (asagidaki "izleme" kolu). Neden ve nasil
#    calistigi: CLAUDE.md 6q.

# Sorgu dizesini ATAN yol (map degeri; $uri KULLANILAMAZ cunku try_files
# sonrasi /index.php'ye doner ve butun sayfalar tek anahtarda toplanirdi).
map $request_uri $wpc_request_path {
    ~^(?<wpc_yol>[^?]*)   $wpc_yol;
    default               $request_uri;
}

# Bu davranis yalnizca asagidaki hostlarda acik. chestnyznak BILEREK disarida:
# degisiklik onun icin bit bit etkisiz kalsin diye (ayri is, ayri oturum).
map $host $wpc_qs_norm {
    default              0;
    fdartgallery.com     1;
    www.fdartgallery.com 1;
    dev.fdartgallery.com 1;
}

# Sorgu dizesi turu. "izleme" = dizedeki HER parametre bir izleme parametresi.
# Tek bir yabanci parametre (s=, orderby=, add-to-cart=...) varsa "diger" olur.
map $query_string $wpc_qs_tur {
    default 'diger';
    ""      'bos';
    ~*^(?:(?:utm_[a-z_]+|gclid|gbraid|wbraid|dclid|fbclid|msclkid|ttclid|twclid|igshid|yclid|epik|mc_cid|mc_eid|_gl|gad_source|gad_campaignid|srsltid|s_kwcid|li_fat_id|hsa_[a-z]+|pk_[a-z]+|mtm_[a-z_]+|piwik_[a-z]+)=[^&]*&?)+$ 'izleme';
}

# Okuma izni: izleme-only istekler de onbellekten OKUYABILIR.
map "$wpc_qs_norm:$wpc_qs_tur" $wpc_bypass_qs {
    default    1;
    "0:bos"    0;
    "1:bos"    0;
    "1:izleme" 0;
}

# Okuma anahtari: izleme-only istekte sorgu dizesi DUSER, yani `/?utm_...`
# istegi duz `/` girdisini okur.
map "$wpc_qs_norm:$wpc_qs_tur" $wpc_cache_uri {
    default    $request_uri;
    "1:izleme" $wpc_request_path;
}

# YAZMA YASAGI — bu isin can alici yeri.
# Olculdu (02.09.2026): sorgu dizesi HTML'e SIZIYOR. WooCommerce'in 19 adet
# `add-to-cart` baglantisi gecerli URL uzerine kuruluyor
# (`/?utm_source=a&add-to-cart=93`), `_wp_http_referer` de oyle. Izleme'li bir
# yaniti duz `/` anahtarina YAZSAYDIK, sonraki ziyaretci BASKASININ utm'ini
# tasiyan baglantilar gorurdu. Bu yuzden izleme'li yanit asla yazilmaz:
# yalnizca duz istekler girdiyi doldurur, izleme'li istekler onu okur.
map "$wpc_qs_norm:$wpc_qs_tur" $wpc_no_store_qs {
    default    0;
    "1:izleme" 1;
}

# Dordu de 0 ise onbellek acik.
map "$wpc_bypass_cookie$wpc_bypass_uri$wpc_bypass_method$wpc_bypass_qs" $skip_cache {
    default 1;
    "0000"  0;
}

# 5) YANIT tarafi: PHP kimlik/oturum cerezi kuruyorsa o yanit ASLA
# onbelleklenmez. Bu sart olmadan bir ziyaretcinin oturum cerezi baskalarina
# servis edilebilir (WooCommerce'te sepetlerin karismasi demektir).
# Zararsiz cerezler (orn. woocommerce_recently_viewed) onbellegi engellemez.
map $upstream_http_set_cookie $wpc_respcookie {
    default                       0;
    ~*wordpress_logged_in_        1;
    ~*wordpress_sec_              1;
    ~*wp-postpass_                1;
    ~*wp-settings-                1;
    ~*comment_author_             1;
    ~*wp_woocommerce_session_     1;
    ~*woocommerce_cart_hash       1;
    ~*woocommerce_items_in_cart   1;
}

# Snippet'lerdeki `fastcgi_no_cache $skip_cache $wpc_bypass_respcookie;` satiri
# DEGISMEDI. Yazma yasagi bu birlesik map ile eklendi — dort site snippet'i de
# oldugu gibi kaliyor. chestnyznak icin $wpc_no_store_qs her zaman 0 oldugundan
# sonuc eskisiyle birebir ayni.
map "$wpc_no_store_qs$wpc_respcookie" $wpc_bypass_respcookie {
    default 1;
    "00"    0;
}

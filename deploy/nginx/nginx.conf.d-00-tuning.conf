# /etc/nginx/conf.d/00-tuning.conf
# Multi-site VPS icin global ayarlar.

server_names_hash_bucket_size 64;
server_tokens off;

client_max_body_size 128M;
client_body_timeout 60s;

keepalive_timeout 30s;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/rss+xml
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Basit brute-force korumasi (wp-login / xmlrpc icin kullanilir)
limit_req_zone $binary_remote_addr zone=wplogin:10m rate=15r/m;

# FastCGI cache alani (site bazinda acilabilir)
fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=WPCACHE:100m inactive=60m max_size=1g;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

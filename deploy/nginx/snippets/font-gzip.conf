# Yazi tipi dosyalarini sikistirir.
#
# NEDEN GEREKLI (olculdu 02.09.2026, dev.fdartgallery.com):
#   Outfit-Regular.ttf  54.916 bayt  content-encoding: (yok)
#   Amithen.otf        411.884 bayt  content-encoding: (yok)
# Ayni sayfada CSS/JS gzip'li geliyordu; fontlar gelmiyordu. Iki sebep:
#   1. Ubuntu'nun /etc/nginx/mime.types dosyasinda `ttf` ve `otf` YOK; nginx
#      onlari `application/octet-stream` olarak servis ediyor.
#   2. `application/octet-stream` global `gzip_types` listesinde degil —
#      ve ORAYA KONMAMALI, cunku o tur her tanimsiz ikili dosyanin torbasidir
#      (zip, exe, halihazirda sikistirilmis arsivler...).
#
# COZUM: yalnizca .ttf/.otf/.eot ile eslesen bu location icinde
# `application/octet-stream` gzip'lenir. Kapsam uzantiyla sinirli oldugu icin
# baska bir ikili dosya turu etkilenmez.
#
# woff / woff2 BILEREK YOK: ikisi de zaten sikistirilmis kapsayicidir; tekrar
# gzip'lemek CPU harcar ve boyutu buyutur.
#
# KURULUM: vhost'ta `include snippets/wordpress.conf;` satirindan ONCE
# include edilmeli — nginx regex location'lari TANIM SIRASINA gore dener ve
# wordpress.conf icindeki genis statik blok `ttf|otf|eot` uzantilarini da
# kapsar; sonra include edilirse bu dosya hic devreye girmez.

location ~* \.(ttf|otf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    # Tekrar SART: kendi add_header'i olan location ust seviyeyi MIRAS ALMAZ
    # (CLAUDE.md 6b). Olmazsa deneme ortaminin fontlari aramaya acik kalir.
    add_header X-Robots-Tag $robots_tag always;

    gzip on;
    gzip_types application/octet-stream font/ttf font/otf application/vnd.ms-fontobject;

    access_log off;
    try_files $uri =404;
}

# WordPress ortak yonlendirme + statik dosya kurallari.

index index.php index.html;

location / {
    try_files $uri $uri/ /index.php?$args;
}

# wp-admin icin pretty permalink destegi
location = /wp-admin { return 301 $scheme://$host$uri/; }

# Statik icerik uzun cache
location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|mjs|woff|woff2|ttf|otf|eot|mp4|webm|pdf)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; allow all; }

# wp-cron'u nginx uzerinden disari kapat (sistem cron kullanilacak)
location = /wp-cron.php {
    deny all;
    access_log off;
}

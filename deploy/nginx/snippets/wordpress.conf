# WordPress ortak yonlendirme + statik dosya kurallari.

index index.php index.html;

location / {
    try_files $uri $uri/ /index.php?$args;
}

# wp-admin icin pretty permalink destegi
location = /wp-admin { return 301 $scheme://$host$uri/; }

# Statik icerik uzun cache
location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|mjs|woff|woff2|ttf|otf|eot|mp4|webm|pdf)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

location = /favicon.ico { access_log off; log_not_found off; }
# try_files SART: diskte robots.txt yoksa istek WordPress'e dusmeli. WordPress
# (ve Yoast) sanal bir robots.txt uretir ve icine site haritasini yazar.
# try_files olmadan nginx dogrudan 404 doner; arama motoru site haritasini
# kanonik yerinde bulamaz. Iki sitede de bu yuzden 404 aliniyordu (01.09.2026).
location = /robots.txt  {
    access_log off; log_not_found off; allow all;
    try_files $uri /index.php?$args;
}

# wp-cron'u nginx uzerinden disari kapat (sistem cron kullanilacak)
location = /wp-cron.php {
    deny all;
    access_log off;
}

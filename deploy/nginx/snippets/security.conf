# Ortak guvenlik kurallari - her site vhost'unda include edilir.

# Gizli dosyalar (.env, .git, .htaccess ...)
location ~ /\.(?!well-known).* {
    deny all;
    access_log off;
    log_not_found off;
}

# Yedek / dokum dosyalari asla servis edilmesin
location ~* \.(sql|bak|old|orig|save|swp|tar|tar\.gz|tgz|zip)$ {
    deny all;
    access_log off;
}

# Upload dizininde PHP calistirilmasin (yaygin WP saldiri vektoru)
location ~* /wp-content/uploads/.*\.php$ {
    deny all;
}

# WordPress'in tehlikeli/gereksiz uclari
location = /xmlrpc.php {
    deny all;
    access_log off;
}

location ~* ^/(?:wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt) {
    deny all;
}

# Guvenlik basliklari
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;

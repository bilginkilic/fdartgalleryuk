# Deneme (staging) ortamlari — arama motorlarina KAPALI.
#
# Buraya yazilan her host adi, TUM yanitlarinda
# `X-Robots-Tag: noindex, nofollow, noarchive, nosnippet` alir.
# Basligi basan yer: snippets/wordpress.conf (hem server seviyesinde,
# hem statik dosya location'inda).
#
# NEDEN MAP: `add_header`'i dogrudan dev vhost'una koymak YETMIYOR.
# nginx'te bir location kendi `add_header`'ini tanimlarsa ust seviyedeki
# add_header'lari MIRAS ALMAZ — wordpress.conf'taki statik dosya blogunda
# `add_header Cache-Control ...` var, yani resim/PDF/webp gibi dogrudan
# servis edilen dosyalar basligi almazdi. Tam da kapatmak istedigimiz
# sizinti orasi.
#
# Bos deger => nginx basligi HIC eklemez. Yani canli siteler etkilenmez;
# yeni bir dev sitesi eklerken buraya bir satir eklemek yeterlidir.
map $host $robots_tag {
    default                            "";
    dev.chestnyznak.com.tr             "noindex, nofollow, noarchive, nosnippet";
    chestnyznak-dev.chemiartclick.uk   "noindex, nofollow, noarchive, nosnippet";
    dev.fdartgallery.com               "noindex, nofollow, noarchive, nosnippet";
}

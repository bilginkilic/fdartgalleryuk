# Catch-all: tanimsiz domain / IP ile gelen istekleri reddet.
# Multi-site kurulumda ilk sitenin yanlislikla "varsayilan site" olmasini engeller.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 444;
    }
}

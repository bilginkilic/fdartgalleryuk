# webmail.chestnyznak.com.tr → timeweb webmail'e 301
#
# NEDEN VAR: bu ad bizim IP'ye bakiyordu ama sunucuda karsiligi yoktu; istek
# ilk 443 bloguna dusuyor ve WordPress kanonik yonlendirmesiyle MAGAZAYA
# gidiyordu. Webmail'e girmek isteyen musteri magazanin ana sayfasinda
# buluyordu kendini.
#
# NEDEN CNAME DEGIL: timeweb `*.timeweb.com` sertifikasi sunuyor. Ad dogrudan
# timeweb'e CNAME'lenirse tarayici SERTIFIKA UYARISI verir — `mail.chestnyznak.com.tr`
# kaydinda bugun yasanan durum budur. Kendi Let's Encrypt sertifikamizla
# yonlendirince uyari cikmaz.
#
# NEDEN GRI (proxied=false): chestnyznak Rusya pazarina calisiyor ve Cloudflare
# IP araliklari oradan engelli (bkz. CLAUDE.md 6d). Site gri; webmail de gri.
#
# DIKKAT: bu vhost'a `cloudflare-only.conf` EKLENMEZ — eklenirse dogrudan
# gelen istek 444 yer ve webmail erisilemez olur.

server {
    listen 80;
    listen [::]:80;
    server_name webmail.chestnyznak.com.tr;

    # ACME dogrulamasi; server seviyesinde `return` KOYMAYIN (bkz. CLAUDE.md 6b)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webmail.chestnyznak.com.tr;

    ssl_certificate     /etc/letsencrypt/live/webmail.chestnyznak.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail.chestnyznak.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    # Arama motorlari bu adresi indekslemesin — icerik bize ait degil.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        return 301 https://mail.timeweb.com/;
    }
}

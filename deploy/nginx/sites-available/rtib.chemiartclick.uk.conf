# rtib.chemiartclick.uk — RTIB demo (Node 22, systemd: rtib.service, :8080)
#
# NEDEN AYRI VHOST: mevcut dort WordPress sitesine dokunmamak icin. PHP-FPM
# havuzu, veritabani ve WordPress snippet'leri YOK — bu bir Node uygulamasi.
#
# NEDEN noindex: demo, aramaya girmemeli. Sayfalarin kendi <meta robots> etiketi
# de var; bu baslik ikinci katman. Location'in kendi add_header'i ust seviyeyi
# MIRAS ALMAZ, o yuzden /brd/ icinde tekrar edilir (bkz. genel CLAUDE.md 6b).
#
# Sertifika DNS-01 ile alindi (gecis oncesi hazir olsun diye); yenileme webroot ile.

server {
    listen 80;
    listen [::]:80;
    server_name rtib.chemiartclick.uk;

    # ACME; server seviyesinde `return` KOYMAYIN (genel CLAUDE.md 6b)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rtib.chemiartclick.uk;

    ssl_certificate     /etc/letsencrypt/live/rtib.chemiartclick.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtib.chemiartclick.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/cloudflare-realip.conf;
    include snippets/cloudflare-only.conf;

    access_log /var/log/nginx/rtib.access.log;
    error_log  /var/log/nginx/rtib.error.log;

    client_max_body_size 1m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    # Ihtiyac formu: Node yalnizca site/ klasorunu servis ediyor, brd/ disarida
    # kaliyor — bu yuzden nginx'ten dogrudan verilir.
    location /brd/ {
        alias /opt/rtib-swordbros/brd/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /brd { return 301 /brd/; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

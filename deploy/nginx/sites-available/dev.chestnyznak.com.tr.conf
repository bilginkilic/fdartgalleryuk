# dev.chestnyznak.com.tr — chestnyznak.com.tr'nin deneme (staging) ortami.
#
# DIKKAT 1: Kok dizin, sistem kullanicisi, PHP-FPM havuzu, socket, veritabani ve
#           log adlari hala ESKI ada gore (dev.chestnyznak.chemiartclick.uk).
#           Dizini yeniden adlandirmak open_basedir'i, cron'u ve yedek isini
#           birden kirar — bilerek dokunulmadi.
# DIKKAT 2: Bu vhost'ta `cloudflare-only.conf` YOK ve olmamali.
#           dev.chestnyznak.com.tr gri (proxy kapali) yayinlaniyor; canli site de
#           oyle (Rusya erisimi icin, bkz. CLAUDE.md 5l). Guard eklenirse 444 doner.
# DIKKAT 3: Site aramaya kapali olmasini `fd-staging-guard.php` mu-plugin'i
#           sagliyor (blog_public 0'a zorlanir -> noindex,nofollow). Bu dosya
#           silinirse staging Google'a girer ve canliyla ikizlenmis icerik olur.

# --- Eski ad: kanonik adrese 301 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chestnyznak-dev.chemiartclick.uk;

    ssl_certificate /etc/letsencrypt/live/chestnyznak-dev.chemiartclick.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chestnyznak-dev.chemiartclick.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://dev.chestnyznak.com.tr$request_uri;
    }
}

# --- Kanonik dev adresi ---
server {

    server_name dev.chestnyznak.com.tr;
    root /var/www/dev.chestnyznak.chemiartclick.uk/public;

    access_log /var/log/nginx/dev_chestnyznak_chemiartclick_uk.access.log;
    error_log  /var/log/nginx/dev_chestnyznak_chemiartclick_uk.error.log;

    # Let's Encrypt dogrulamasi her zaman acik kalsin
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    # Cloudflare proxy arkasinda gercek ziyaretci IP'si
    include snippets/cloudflare-realip.conf;

    include snippets/wordpress.conf;
    include snippets/security.conf;

    # Giris sayfasina hiz limiti
    location = /wp-login.php {
        limit_req zone=wplogin burst=5 nodelay;
        include snippets/fastcgi-php-dev_chestnyznak_chemiartclick_uk.conf;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php-dev_chestnyznak_chemiartclick_uk.conf;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/chestnyznak-dev.chemiartclick.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chestnyznak-dev.chemiartclick.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --- HTTP: ACME + HTTPS'e yonlendirme ---
server {
    listen 80;
    listen [::]:80;

    server_name dev.chestnyznak.com.tr chestnyznak-dev.chemiartclick.uk;

    # ACME dogrulamasi 80'den gelir; server seviyesinde `return` KOYMAYIN —
    # rewrite asamasinda calisip location eslesmesini kisa devre yapar ve
    # HTTP-01 dogrulamasi 404 alir.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
